<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Sabor Peruano Staff'">Staff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/assets/css/styles.css(v=1.3)}">
</head>

<body>

    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar(activePage)" class="sidebar">
        <div class="sidebar-brand">
            SABOR<span class="text-red"> PERUANO</span>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/empleado}" class="sidebar-link" th:classappend="${activePage == 'operaciones' ? 'active' : ''}">
                <i class="bi bi-cpu"></i>
                <span>Operaciones</span>
            </a>
            <a th:href="@{/empleado/mesas}" class="sidebar-link" th:classappend="${activePage == 'mesas' ? 'active' : ''}">
                <i class="bi bi-grid-3x3-gap"></i>
                <span>Mapa de Mesas</span>
            </a>
            <a th:href="@{/empleado/menu}" class="sidebar-link" th:classappend="${activePage == 'menu' ? 'active' : ''}">
                <i class="bi bi-journal-richtext"></i>
                <span>Menú del Día</span>
            </a>
            <hr class="my-4 opacity-10">
            <a th:href="@{/}" class="sidebar-link">
                <i class="bi bi-box-arrow-left"></i>
                <span>Salir</span>
            </a>
        </nav>
    </aside>

    <!-- Header Fragment -->
    <header th:fragment="header(pageTitle)" class="p-4 bg-white shadow-sm d-flex justify-content-between align-items-center sticky-top">
        <h4 class="mb-0 fw-bold" th:text="${pageTitle}">Panel Operativo</h4>
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-red btn-sm px-3" onclick="openModal('reserveModal')">
                <i class="bi bi-plus-circle me-1"></i> Nueva Reserva
            </button>
            <div class="bg-dark rounded-circle p-2 text-white fw-bold d-flex align-items-center justify-content-center"
                 style="width: 40px; height: 40px;">EM</div>
        </div>
    </header>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function showToast(message) {
                const toast = document.createElement('div');
                toast.className = 'position-fixed top-0 start-50 translate-middle-x mt-4 p-3 bg-red text-white rounded-3 fw-bold shadow-lg';
                toast.style.zIndex = '10000';
                toast.style.animation = 'fadeIn 0.5s ease-out';
                toast.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i> ${message}`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
            function openModal(id) {
                new bootstrap.Modal(document.getElementById(id)).show();
            }
        </script>
    </div>

</body>
</html>
