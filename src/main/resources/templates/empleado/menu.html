<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{empleado/fragments :: head('Menú del Día')}"></head>
<body class="bg-light">
    <div class="dashboard-wrapper">
        <aside th:replace="~{empleado/fragments :: sidebar('menu')}"></aside>
        <main class="main-content">
            <header th:replace="~{empleado/fragments :: header('Menú del Día')}"></header>
            
            <div class="container-fluid p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0 fw-bold">Platillos Disponibles</h4>
                </div>

                <!-- Buscador -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6 col-lg-4">
                        <div class="input-group bg-white shadow-sm rounded-3">
                            <span class="input-group-text border-0 bg-transparent text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control border-0 bg-transparent py-2" placeholder="Buscar platillo..." onkeyup="filterTable()">
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Plato</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody id="menu-table-body">
                                <tr th:each="item : ${menu}">
                                    <td class="fw-bold text-dark dish-name" th:text="${item.nombre}">Lomo Saltado</td>
                                    <td th:text="${item.categoria != null ? item.categoria.nombre : ''}">Fondos</td>
                                    <td class="fw-bold text-red" th:text="'S/ ' + ${item.precio}">S/ 55.00</td>
                                    <td>
                                        <span th:if="${item.disponibilidad == true}" class="badge bg-success-subtle text-success">Disponible</span>
                                        <span th:if="${item.disponibilidad != true}" class="badge bg-danger-subtle text-danger">Agotado</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para reservas del header -->
    <div class="modal fade" id="reserveModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Nueva Reserva Manual</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form onsubmit="event.preventDefault(); showToast('Reserva creada'); bootstrap.Modal.getInstance(this.closest('.modal')).hide();">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">CLIENTE</label>
                            <input type="text" class="form-control p-3 bg-light border-0" placeholder="Nombre completo" required>
                        </div>
                        <button type="submit" class="btn btn-red w-100 py-3 mt-3 shadow">CONFIRMAR</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{empleado/fragments :: scripts}"></div>

    <script>
        function filterTable() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#menu-table-body tr');

            rows.forEach(row => {
                const name = row.querySelector('.dish-name').textContent.toLowerCase();
                if (name.includes(searchQuery)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
