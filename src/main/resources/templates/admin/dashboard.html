<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Dashboard')}"></head>
<body class="bg-light">
    <div class="dashboard-wrapper">
        <aside th:replace="~{admin/fragments :: sidebar('dashboard')}"></aside>
        <main class="main-content">
            <header th:replace="~{admin/fragments :: header('Dashboard')}"></header>
            <div class="container-fluid p-4 p-lg-5">
                <div class="row g-4 mb-5">
                    <div class="col-xl-3 col-md-6">
                        <div class="card-custom h-100 border-0 stat-card">
                            <h6 class="text-muted small fw-bold">TOTAL RESERVAS</h6>
                            <div class="h2 fw-bold mb-1" th:text="${totalReservas}">1,284</div>
                            <span class="text-success small fw-bold"><i class="bi bi-graph-up"></i> +12%</span>
                            <i class="bi bi-calendar-check"></i>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card-custom h-100 border-0 stat-card">
                            <h6 class="text-muted small fw-bold">VENTAS DEL MES</h6>
                            <div class="h2 fw-bold mb-1" th:text="${ventasMes}">S/ 45,200</div>
                            <span class="text-success small fw-bold"><i class="bi bi-graph-up"></i> +8%</span>
                            <i class="bi bi-cash-stack"></i>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card-custom h-100 border-0 stat-card">
                            <h6 class="text-muted small fw-bold">PLATOS ACTIVOS</h6>
                            <div class="h2 fw-bold mb-1" th:text="${platosActivos}">24</div>
                            <i class="bi bi-egg-fried"></i>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card-custom h-100 border-0 stat-card">
                            <h6 class="text-muted small fw-bold">EQUIPO ACTIVO</h6>
                            <div class="h2 fw-bold mb-1" th:text="${equipoActivo}">12</div>
                            <i class="bi bi-people"></i>
                        </div>
                    </div>
                </div>

                <!-- Monitoreo de Mesas en Tiempo Real -->
                <div class="card-custom border-0 p-4 mb-5 shadow-sm bg-white rounded-4">
                    <h5 class="fw-bold mb-4 d-flex align-items-center gap-2">
                        <i class="bi bi-grid-3x3-gap text-red"></i>
                        <span>Estado y Ocupación de Mesas en Tiempo Real</span>
                    </h5>
                    <div class="row g-3">
                        <div th:each="m : ${mesas}" class="col-6 col-sm-4 col-md-3 col-xl-2">
                            <div class="card h-100 border-0 shadow-sm p-3 rounded-3" 
                                 th:classappend="${m.estado == 'Disponible' ? 'bg-success-subtle border-start border-success border-4' : (m.estado == 'Ocupada' ? 'bg-danger-subtle border-start border-danger border-4' : 'bg-warning-subtle border-start border-warning border-4')}">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="fw-bold text-dark" th:text="${m.numero}">Mesa 01</span>
                                    <span class="badge rounded-pill text-dark bg-white shadow-sm" th:text="${m.capacidad} + ' Pax'">4 Pax</span>
                                </div>
                                <div class="small text-muted mb-2" th:text="${m.ubicacion}">Salón Principal</div>
                                <span class="badge rounded-pill align-self-start fw-bold" 
                                      th:classappend="${m.estado == 'Disponible' ? 'bg-success text-white' : (m.estado == 'Ocupada' ? 'bg-danger text-white' : 'bg-warning text-dark')}"
                                      th:text="${m.estado}">Disponible</span>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(mesas)}" class="col-12 text-center py-4 text-muted">
                            <i class="bi bi-info-circle me-1"></i> No hay mesas registradas.
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{admin/fragments :: scripts}"></div>
</body>
</html>
