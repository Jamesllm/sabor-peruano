<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('Reservas')}"></head>
<body class="bg-light">
    <div class="dashboard-wrapper">
        <aside th:replace="~{admin/fragments :: sidebar('reservas')}"></aside>
        <main class="main-content">
            <header th:replace="~{admin/fragments :: header('Reservas')}"></header>
            <div class="container-fluid p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="mb-0 fw-bold">Lista de Reservas</h4>
                    <button class="btn btn-red btn-sm px-4" data-bs-toggle="modal" data-bs-target="#reservaModal" onclick="openCreateModal()">
                        <i class="bi bi-plus-lg me-2"></i>Nueva Reserva
                    </button>
                </div>

                <!-- Buscador y Filtros -->
                <div class="row g-3 mb-4 align-items-center">
                    <!-- Buscador -->
                    <div class="col-md-6 col-lg-4">
                        <div class="input-group bg-white shadow-sm rounded-3">
                            <span class="input-group-text border-0 bg-transparent text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="searchInput" class="form-control border-0 bg-transparent py-2" placeholder="Buscar cliente..." onkeyup="filterTable()">
                        </div>
                    </div>
                    <!-- Filtros de Estado -->
                    <div class="col-md-6 col-lg-8 text-md-end">
                        <div class="btn-group shadow-sm rounded-3" role="group">
                            <input type="radio" class="btn-check" name="statusFilter" id="filterAll" checked onclick="setStatusFilter('all')">
                            <label class="btn btn-outline-dark px-3 py-2 border-0" for="filterAll">Todos</label>

                            <input type="radio" class="btn-check" name="statusFilter" id="filterActive" onclick="setStatusFilter('active')">
                            <label class="btn btn-outline-dark px-3 py-2 border-0" for="filterActive">Activas</label>

                            <input type="radio" class="btn-check" name="statusFilter" id="filterInactive" onclick="setStatusFilter('inactive')">
                            <label class="btn btn-outline-dark px-3 py-2 border-0" for="filterInactive">Inactivas</label>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Fecha / Hora</th>
                                    <th>Pax</th>
                                    <th>Mesa</th>
                                    <th>Consumo</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="reservas-table-body">
                                <tr th:each="reserva : ${reservas}" th:data-activo="${reserva.activo != false}">
                                    <td class="text-muted" th:text="'#' + ${reserva.id}">#1</td>
                                    <td class="fw-bold client-name" th:text="${reserva.cliente}">Juan Pérez</td>
                                    <td th:text="${reserva.fechaHora}">05 Abr, 20:30</td>
                                    <td><span class="badge bg-light text-dark rounded-pill px-3" th:text="${reserva.pax} + ' pax'">2 pax</span></td>
                                    <td th:text="${reserva.mesa}">Mesa 04</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-dark border-0 bg-light"
                                            th:data-platillos="${#strings.listJoin(reserva.platillos, ',')}"
                                            onclick="showDishesModal(this.getAttribute('data-platillos').split(','))">
                                            <i class="bi bi-search me-1"></i> Ver platos
                                        </button>
                                    </td>
                                    <td>
                                        <span class="badge-status" 
                                              th:classappend="${reserva.estado == 'Confirmada' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'}"
                                              th:text="${reserva.estado}">Confirmada</span>
                                    </td>
                                    <td class="text-end">
                                        <button class="btn btn-sm btn-light rounded-circle p-2 mx-1"
                                                data-bs-toggle="modal"
                                                data-bs-target="#reservaModal"
                                                th:data-id="${reserva.id}"
                                                th:data-cliente="${reserva.cliente}"
                                                th:data-fechahora="${reserva.fechaHora}"
                                                th:data-pax="${reserva.pax}"
                                                th:data-mesa="${reserva.mesa}"
                                                th:data-estado="${reserva.estado}"
                                                th:data-activo="${reserva.activo != false}"
                                                th:data-platillos="${#strings.listJoin(reserva.platillos, ',')}"
                                                onclick="openEditModal(this)">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <!-- Logical delete button (only when active) -->
                                        <button th:if="${reserva.activo != false}"
                                                class="btn btn-sm btn-light rounded-circle p-2 mx-1 text-danger"
                                                data-bs-toggle="modal" 
                                                data-bs-target="#deleteConfirmModal"
                                                th:data-delete-url="@{'/admin/reservas/eliminar/' + ${reserva.id}}"
                                                onclick="prepareDelete(this)">
                                            <i class="bi bi-trash"></i>
                                        </button>

                                        <!-- Activation button (only when inactive) -->
                                        <a th:if="${reserva.activo == false}"
                                           th:href="@{'/admin/reservas/activar/' + ${reserva.id}}"
                                           class="btn btn-sm btn-light rounded-circle p-2 mx-1 text-success"
                                           title="Activar Reserva">
                                            <i class="bi bi-check-circle"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Reserva -->
    <div class="modal fade" id="reservaModal" tabindex="-1" aria-labelledby="reservaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 bg-light p-4 rounded-top-4">
                    <h5 class="modal-title fw-bold" id="modalTitle">Nueva Reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/reservas/guardar}" method="post">
                    <div class="modal-body p-4">
                        <input type="hidden" id="reservaId" name="id">
                        <input type="hidden" id="reservaActivo" name="activo">
                        
                        <div class="mb-3">
                            <label for="cliente" class="form-label fw-bold small text-muted">CLIENTE</label>
                            <input type="text" class="form-control bg-light border-0 p-3" id="cliente" name="cliente" required placeholder="Ej. Juan Pérez">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fechaHora" class="form-label fw-bold small text-muted">FECHA / HORA</label>
                                <input type="text" class="form-control bg-light border-0 p-3" id="fechaHora" name="fechaHora" required placeholder="Ej. 05 Abr, 20:30">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="pax" class="form-label fw-bold small text-muted">NÚMERO DE PERSONAS (PAX)</label>
                                <input type="number" class="form-control bg-light border-0 p-3" id="pax" name="pax" min="1" required placeholder="2">
                            </div>
                            <div class="col-md-3 mb-3">
                                <label for="mesa" class="form-label fw-bold small text-muted">MESA / ÁREA</label>
                                <input type="text" class="form-control bg-light border-0 p-3" id="mesa" name="mesa" required placeholder="Ej. Mesa 04">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="platillos" class="form-label fw-bold small text-muted">PLATILLOS / CONSUMO (Presione Ctrl/Cmd para seleccionar varios)</label>
                            <select class="form-select bg-light border-0 p-3" id="platillos" name="platillos" multiple required style="height: 120px;">
                                <option th:each="plat : ${platillosDisponibles}" 
                                        th:value="${plat.nombre}" 
                                        th:text="${plat.nombre}">Lomo Saltado</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="estado" class="form-label fw-bold small text-muted">ESTADO</label>
                            <select class="form-select bg-light border-0 p-3" id="estado" name="estado" required>
                                <option value="Confirmada">Confirmada</option>
                                <option value="Pendiente">Pendiente</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 bg-light rounded-bottom-4">
                        <button type="button" class="btn btn-outline-dark px-4 py-2 border-2" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-red px-5 py-2 text-white shadow-sm">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Detalle de Platos -->
    <div class="modal fade" id="dishesListModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold">Detalle de Consumo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <ul class="list-group list-group-flush" id="dishesListContent"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación de Eliminación -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content rounded-4 border-0 shadow-lg text-center p-4">
                <div class="modal-body">
                    <i class="bi bi-exclamation-triangle-fill display-3 text-warning mb-4"></i>
                    <h4 class="fw-bold mb-3">¿Desactivar reserva?</h4>
                    <p class="text-muted small">Esta acción marcará la reserva como inactiva. No aparecerá en el listado activo.</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <button type="button" class="btn btn-outline-dark px-4" data-bs-dismiss="modal">Cancelar</button>
                        <a id="confirmDeleteBtn" href="#" class="btn btn-red px-4 text-white shadow-sm">Confirmar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/fragments :: scripts}"></div>
    <script>
        function showDishesModal(dishes) {
            const list = document.getElementById('dishesListContent');
            if (Array.isArray(dishes) && dishes.length > 0 && dishes[0].trim() !== '') {
                list.innerHTML = dishes.map(d => `
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-0 px-0 py-2">
                        <span><i class="bi bi-check2-circle text-red me-2"></i> ${d}</span>
                        <span class="badge bg-light text-dark rounded-pill">1</span>
                    </li>
                `).join('');
            } else {
                list.innerHTML = `<li class="list-group-item bg-transparent border-0 px-0 py-2 text-muted">Sin platos seleccionados</li>`;
            }
            new bootstrap.Modal(document.getElementById('dishesListModal')).show();
        }

        function openEditModal(button) {
            document.getElementById('modalTitle').textContent = 'Editar Reserva';
            document.getElementById('reservaId').value = button.getAttribute('data-id');
            document.getElementById('reservaActivo').value = button.getAttribute('data-activo');
            document.getElementById('cliente').value = button.getAttribute('data-cliente');
            document.getElementById('fechaHora').value = button.getAttribute('data-fechahora');
            document.getElementById('pax').value = button.getAttribute('data-pax');
            document.getElementById('mesa').value = button.getAttribute('data-mesa');
            document.getElementById('estado').value = button.getAttribute('data-estado');

            const platillosString = button.getAttribute('data-platillos') || '';
            const platillosArray = platillosString.split(',');
            const select = document.getElementById('platillos');
            for (let i = 0; i < select.options.length; i++) {
                select.options[i].selected = platillosArray.includes(select.options[i].value);
            }
        }

        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Nueva Reserva';
            document.getElementById('reservaId').value = '';
            document.getElementById('reservaActivo').value = 'true';
            document.getElementById('cliente').value = '';
            document.getElementById('fechaHora').value = '';
            document.getElementById('pax').value = '2';
            document.getElementById('mesa').value = '';
            document.getElementById('estado').value = 'Pendiente';
            
            const select = document.getElementById('platillos');
            for (let i = 0; i < select.options.length; i++) {
                select.options[i].selected = false;
            }
        }

        function prepareDelete(button) {
            const deleteUrl = button.getAttribute('data-delete-url');
            document.getElementById('confirmDeleteBtn').setAttribute('href', deleteUrl);
        }

        let currentStatusFilter = 'all';

        function setStatusFilter(status) {
            currentStatusFilter = status;
            filterTable();
        }

        function filterTable() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#reservas-table-body tr');

            rows.forEach(row => {
                const name = row.querySelector('.client-name').textContent.toLowerCase();
                const isActive = row.getAttribute('data-activo') === 'true';

                // Check search query
                const matchesSearch = name.includes(searchQuery);

                // Check status filter
                let matchesStatus = false;
                if (currentStatusFilter === 'all') {
                    matchesStatus = true;
                } else if (currentStatusFilter === 'active') {
                    matchesStatus = isActive;
                } else if (currentStatusFilter === 'inactive') {
                    matchesStatus = !isActive;
                }

                if (matchesSearch && matchesStatus) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
