<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmación de Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9ecef; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Inter', sans-serif; }
        .alert { border-radius: 15px; padding: 30px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: white; }
        .text-peru { color: #D91E1E; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="alert shadow">
            <h2 class="text-peru fw-bold mb-4">Registro Exitoso</h2>
            <p class="fs-5" th:text="${mensaje}">Mensaje de confirmación del registro.</p>
            <hr>
            <a href="/" class="btn btn-outline-dark mt-3">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
