<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Peruano | Iniciar Sesión</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Estilos de la página (usando ruta absoluta para evitar errores) -->
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}" href="/assets/css/styles.css">

    <style>
        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Inter', sans-serif;
        }
        .login-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .form-control-custom {
            border: none;
            background-color: #f8f9fa;
            padding: 12px 15px;
            border-radius: 10px;
        }
        .form-control-custom:focus {
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(217, 16, 35, 0.1);
        }
        .input-group-text {
            background: #f8f9fa;
            border: none;
            border-radius: 10px 0 0 10px;
            color: #6c757d;
        }
    </style>
</head>
<body>

    <!-- Navbar simple -->
    <nav class="navbar navbar-light bg-white shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand fw-800" th:href="@{/}">
                SABOR<span class="text-red"> PERUANO 🍖</span>
            </a>
            <a th:href="@{/}" class="btn btn-outline-dark btn-sm fw-bold px-3">
                <i class="bi bi-house-door me-1"></i> INICIO
            </a>
        </div>
    </nav>

    <main class="login-section">
        <div class="login-card text-center">
            <i class="bi bi-person-circle text-red" style="font-size: 3.5rem;"></i>
            <h2 class="fw-bold mt-3">¡Bienvenido de nuevo!</h2>
            <p class="text-muted mb-4">Ingresa a tu cuenta de Sabor Peruano</p>

            <form th:action="@{/login}" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label small fw-bold">USUARIO</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control form-control-custom" placeholder="Tu usuario" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold">CONTRASEÑA</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-custom" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-red w-100 py-3 shadow-sm mb-3 fw-bold">
                    INICIAR SESIÓN
                </button>

                <p class="small text-muted">
                    ¿No tienes cuenta? <a href="#" class="text-red fw-bold text-decoration-none">Crea una aquí</a>
                </p>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
